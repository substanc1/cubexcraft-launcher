# Сборка CubeXCraft Launcher на машинах GitHub: macOS (универсальный .app + .dmg) и Linux ARM64.
# Linux x86_64 собирается у нас (ПК владельца / VPS). Windows x64 собирается и в Actions (job windows-x64). Запуск: вкладка Actions -> build -> Run workflow.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# репо публичное: токену сборки — только чтение, артефакты живут 3 дня (официальная раздача — сайт)
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm install --no-fund --no-audit
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: collect
        run: |
          mkdir out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/CubeX-macos.dmg
          cp src-tauri/target/universal-apple-darwin/release/CubeX out/CubeX-macos-universal
          # архив .app целиком - для самообновления на macOS (без ._-файлов AppleDouble)
          COPYFILE_DISABLE=1 tar -C src-tauri/target/universal-apple-darwin/release/bundle/macos -czf out/CubeX-macos.app.tar.gz CubeXCraft.app
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/
          retention-days: 3

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-fund --no-audit
      - run: npx tauri build --no-bundle
      - run: mkdir out && cp src-tauri/target/release/CubeX out/CubeX-linux-arm64 && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: out/
          retention-days: 3

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run build:win
      - name: check PE x64
        shell: pwsh
        run: |
          $path = "src-tauri/target/x86_64-pc-windows-msvc/release/CubeX.exe"
          $b = [System.IO.File]::ReadAllBytes($path)
          $e = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $e + 4)
          if ($machine -ne 0x8664) {
            Write-Host ("ERROR: PE machine=0x{0:X4}, ожидали 0x8664 (x64)" -f $machine)
            exit 1
          }
          Write-Host "OK: PE x64 (0x8664)"
      - name: collect
        shell: pwsh
        run: |
          New-Item out -ItemType Directory
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/CubeX.exe out/CubeX.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/
          retention-days: 3
